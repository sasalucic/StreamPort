name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  privacy-and-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python tools/check_public.py
      - run: pip install -r server/requirements.txt
      - run: cd server && python -m unittest discover -s tests -p 'test_*.py'
      - run: python roku/tests/server_contract.py server
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: for x in server/static/*.js; do node --check "$x"; done
      - run: for x in server/tests/*.cjs; do node --check "$x"; done
      - run: |
          cd server
          node tests/test-search.cjs
          node tests/ui-smoke.cjs
          node tests/ui-v03.cjs
      - run: for x in android/tests/*.cjs android-tv/tests/*.cjs; do node --check "$x"; done
  java-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: |
          mkdir -p android/build-tests android-tv/build-tests
          javac -d android/build-tests android/app/src/main/java/org/streamport/mobile/ServerAddress.java android/tests/ServerAddressTest.java
          java -cp android/build-tests ServerAddressTest
          javac -d android-tv/build-tests android-tv/app/src/main/java/org/streamport/tv/ServerAddress.java android-tv/tests/ServerAddressTest.java
          java -cp android-tv/build-tests ServerAddressTest
          javac -d android-tv/build-tests android-tv/app/src/main/java/org/streamport/tv/SessionCookie.java android-tv/tests/SessionCookieTest.java
          java -cp android-tv/build-tests org.streamport.tv.SessionCookieTest
